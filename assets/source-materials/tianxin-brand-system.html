<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天台天信 — 品牌标识系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@300;400&family=Noto+Sans+SC:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: #FAFAFA; color: #1A1A1A; overflow-x: hidden;
        }
        .font-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
        html { scroll-behavior: smooth; }
        .tracking-ultra-wide { letter-spacing: 0.2em; }

        /* Grid pattern background for logo display */
        .logo-grid-bg {
            background-image:
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .logo-grid-bg-dark {
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Section */
        .section-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.35;
        }
        .section-divider {
            width: 40px; height: 1px;
            background: linear-gradient(90deg, transparent, #1E3A5F, transparent);
        }

        /* Card */
        .preview-card {
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }
        .preview-card:hover {
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        /* Application mockups */
        .mockup-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        /* Clear space markers */
        .clear-space-marker {
            border: 1px dashed rgba(30,58,95,0.25);
            position: relative;
        }
        .clear-space-marker::before {
            content: 'X';
            position: absolute;
            font-size: 8px;
            color: rgba(30,58,95,0.3);
            font-family: 'JetBrains Mono', monospace;
        }
        .clear-space-marker.top::before { top: -14px; left: 50%; transform: translateX(-50%); }
        .clear-space-marker.bottom::before { bottom: -14px; left: 50%; transform: translateX(-50%); }
        .clear-space-marker.left::before { left: -12px; top: 50%; transform: translateY(-50%); }
        .clear-space-marker.right::before { right: -12px; top: 50%; transform: translateY(-50%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const PRIMARY = '#1E3A5F';
        const SECONDARY = '#2E6B9E';
        const ACCENT = '#4A90C4';
        const LIGHT = '#E8F0F8';
        const DARK = '#0C1B2E';

        // ============================================================
        //  真实Logo组件 — 三个版本
        // ============================================================

        // 原始版 — 直接引用 SVG 文件（imagetracer.js 描摹的位图，2000x2000）
        const TXIconOriginal = ({ size = 100 }) => (
            <img
                src="天台天信会计师事务所logo-原始.svg"
                width={size}
                height={size}
                style={{ display: 'block' }}
                alt="天台天信 原始版"
            />
        );

        // 现代蓝版 — 直接引用 SVG 文件
        const TXIconModernBlue = ({ size = 100 }) => (
            <img
                src="天台天信会计师事务所logo-现代-蓝.svg"
                width={size}
                height={size}
                style={{ display: 'block' }}
                alt="天台天信 现代蓝版"
            />
        );

        // 现代朱红版 — 直接引用 SVG 文件
        const TXIconVermilion = ({ size = 100 }) => (
            <img
                src="天台天信会计师事务所logo-现代-朱红.svg"
                width={size}
                height={size}
                style={{ display: 'block' }}
                alt="天台天信 现代朱红版"
            />
        );

            <img
                src="天台天信会计师事务所logo-现代-蓝.svg"
                width={size}
                height={size}

            <img
                src="天台天信会计师事务所logo-现代-蓝.svg"

        const LogoIconOnly = ({ size = 80, variant = 'filled' }) => {

            if (variant === 'outline') return <TXIconOutline size={size} />;
            if (variant === 'modernBlue') return <TXIconModernBlue size={size} />;

                                <div style={{ textAlign: 'center' }}>
